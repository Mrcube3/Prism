[project]
name = "prism-api"
version = "0.1.0"
description = "PRISM backend: provenance, Bitget connectors and deterministic risk engines."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "websockets>=13",
  "tzdata>=2024.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
